<title>Arrows 体力測定 結果</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Oswald:wght@400;500;600&display=swap">
<style>
/* Arrows 体力測定 結果ページ（保護者用）。お子さまの名前と生年月日で、その子の結果だけを出す */
:root{
  --bg:#FFF7EA; --surface:#FFFFFF; --sunk:#F6ECDB; --ink:#2B2152; --muted:#6F6587; --line:#EADFCB; --shadow:#E4D6BD;
  --primary:#5B3FD9; --accent:#FFD23F; --good:#16935A; --bad:#C2410C;
  --c-run:#FF7A2F; --c-side:#F2468A; --c-jump:#22A867; --c-ball:#2D86F0;
  --t-run:#FFE6D6; --t-side:#FDDCEA; --t-jump:#D8F3E4; --t-ball:#DAEAFD;
  --gold:#E8A800; --silver:#9AA3B5; --bronze:#C77B3B;
  --display:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","M PLUS Rounded 1c","Hiragino Sans","Yu Gothic",sans-serif;
  --num:"Fredoka","Hiragino Maru Gothic ProN","SF Pro Rounded","Helvetica Neue",Arial,sans-serif;
  color-scheme:light }
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.6;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 48px;
  background-image:radial-gradient(circle at 1px 1px, var(--line) 1.2px, transparent 1.3px);background-size:22px 22px}
.wrap{max-width:640px;margin:0 auto}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--shadow);padding:18px}
header{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{display:flex;gap:4px}.logo i{width:12px;height:12px;border-radius:50%;display:block}
header h1{margin:0;font-size:20px}
header small{display:block;font-size:12px;color:var(--muted);font-weight:700}
/* ログイン */
.login h2{margin:0 0 4px;font-size:20px}
.login p{margin:0 0 14px;color:var(--muted);font-size:14px}
label{display:block;font-weight:800;margin:12px 0 0}
label small{font-weight:700;color:var(--muted);font-size:12px;margin-left:6px}
input{display:block;width:100%;box-sizing:border-box;margin-top:6px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:18px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--primary);outline-offset:1px}
.bd{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.bd input{text-align:center}
.btn{display:block;width:100%;margin-top:18px;border:0;border-radius:16px;padding:15px;font:inherit;font-size:18px;font-weight:800;background:var(--primary);color:#fff;box-shadow:0 4px 0 #3B27A0;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow);font-size:15px;padding:11px}
.err{color:var(--bad);font-weight:700;font-size:14px;margin:12px 0 0;min-height:1em}
.note{font-size:12px;color:var(--muted);margin:14px 0 0}
/* 結果 */
.who h2{margin:0;font-size:22px}
.res .card.who,.res .card.comment{padding:12px 14px}
.who .sub{color:var(--muted);font-weight:700;font-size:14px}
.who .tag{display:inline-block;background:var(--accent);border-radius:999px;padding:2px 12px;font-weight:800;font-size:13px;color:var(--ink);margin-bottom:6px}
.comment{margin-top:10px;background:#FFFBEF;border-color:#F3D98B;font-size:15px;line-height:1.55}
.comment h3{margin:0 0 6px;font-size:15px}
.comment p{margin:0;white-space:pre-wrap}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.item{padding:0;overflow:hidden}
.item{border-radius:16px;box-shadow:0 3px 0 var(--shadow)}
.item .hd{display:flex;align-items:center;gap:6px;padding:6px 10px;font-weight:800;font-size:14px}
.item .bdy{padding:8px 10px 8px}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big .v{font-family:var(--num);font-weight:700;font-size:32px;line-height:1}
.big .u{font-weight:800;color:var(--muted)}
.rank{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px 2px 3px;font-weight:800;font-size:13px;background:var(--sunk);margin-top:6px;flex-wrap:wrap}
.rank b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-family:var(--num);font-size:13px}
.rank.r1 b{background:var(--gold)}.rank.r2 b{background:var(--silver)}.rank.r3 b{background:var(--bronze)}
.rank small{font-size:10px;color:var(--muted);font-weight:700;line-height:1.2}
.tries{margin-top:6px;font-size:14px;color:var(--muted);font-weight:700}
.tries .num{color:var(--ink);font-size:16px}
.cmpline{margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}.cmpline .num{color:var(--ink);font-size:13px}
.cmpline .up{display:inline-block;margin-left:4px;background:#DDF5E8;color:var(--good);border-radius:999px;padding:0 7px;font-weight:800;font-size:12px}
.none{color:var(--muted);font-weight:700}
svg{display:block;width:100%;height:auto;margin-top:4px}
.foot{margin-top:22px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
.foot a{color:var(--muted)}
/* ランキング（ポスターと同じ雰囲気：青地に紙ふぶき・RANKING・白い帯・種目ごとの色の見出し） */
body.rk{background:#FFF7EA}
body.rk header,body.rk .foot{display:none}
.rkv{color:#2B2152;padding-bottom:12px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.rkv .chips{display:flex;gap:4px;overflow-x:auto;padding:8px 8px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rkv .chips::-webkit-scrollbar{display:none}
.rkv .chips button{flex:none;border:2px solid #EADFCB;background:#fff;color:#2B2152;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.rkv .chips button[aria-pressed="true"]{background:#5B3FD9;border-color:#5B3FD9;color:#fff}
.rkv .back{display:inline-block;margin-top:10px;border:2px solid #EADFCB;background:#fff;color:#2B2152;border-radius:999px;padding:6px 16px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.rkv .msg{text-align:center;padding:40px 10px;font-weight:700}
/* ランキング（結果ページと同じクリーム地に、種目の色・丸い文字・星。幅707の紙を画面に合わせて縮める） */
.pw{position:relative;overflow:hidden}
.poster{position:absolute;left:0;top:0;width:707px;transform-origin:0 0;box-sizing:border-box;padding:30px 18px 34px;color:#2B2152;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","M PLUS Rounded 1c",var(--display);
  background:#FFF7EA radial-gradient(circle at 1px 1px, #EADFCB 1.4px, transparent 1.5px) 0 0/20px 20px}
.ptop{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:16px;border-bottom:3px dotted #E2CFA8}
.ptop .k{font-family:"Fredoka",var(--num);font-weight:600;font-size:16px;letter-spacing:.16em;color:#E08A00}
.ptop .t{font-family:"Fredoka",var(--num);font-weight:700;font-size:78px;line-height:.95;letter-spacing:.02em;margin-top:2px;color:#5B3FD9;text-shadow:0 5px 0 #D9CCFA}
.ptop .t i{font-style:normal;font-size:36px;vertical-align:top;margin-left:6px;color:#FFC93C;text-shadow:0 3px 0 #E8A800}
.ptop .bu{text-align:right}
.ptop .bu{flex:none}
.ptop .bu b{display:inline-block;white-space:nowrap;font-size:21px;font-weight:700;letter-spacing:.04em;background:#FFD23F;color:#2B2152;border-radius:999px;padding:5px 16px;box-shadow:0 3px 0 #E0B21C}
.ptop .bu span{display:block;margin-top:8px;font-size:13px;color:#7A7091;letter-spacing:.06em}
.ptop .bu span em{font-style:normal;font-family:"Fredoka",var(--num);font-weight:600;font-size:22px;color:#2B2152;margin:0 3px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px 14px;margin-top:26px}
.pblk h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 14px;border-radius:999px;font-size:19px;font-weight:700;letter-spacing:.08em;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pblk h4 small{margin-left:auto;font-family:"Fredoka",var(--num);font-size:12px;font-weight:600;letter-spacing:.12em;opacity:.9}
.prow{display:grid;grid-template-columns:30px 62px 1fr;align-items:center;column-gap:7px;height:38px;margin-bottom:5px;padding:0 6px 0 4px;border-radius:12px;background:#fff;border:2px solid #EADFCB;box-shadow:0 2px 0 #E4D6BD}
.prow.r1{background:#FFF6D6;border-color:#F5DC8A}
.prow .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:"Fredoka",var(--num);font-weight:700;font-size:15px;color:#7A7091;border:2px solid #E2D6C0;background:#fff}
.prow.r1 .n{background:#FFC93C;border-color:#FFE7A0;color:#5A3A00;box-shadow:0 2px 0 #B8860B}
.prow.r2 .n{background:#D9DEE8;border-color:#F2F4F8;color:#3B4252;box-shadow:0 2px 0 #8F98AA}
.prow.r3 .n{background:#E39A5F;border-color:#F3C49C;color:#4A2508;box-shadow:0 2px 0 #9C5A28}
.prow .v{font-family:"Fredoka",var(--num);font-weight:600;font-size:22px;text-align:right;white-space:nowrap;color:#2B2152}
.prow.r1 .v{color:#D97706}
.prow .v small{font-family:var(--display);font-size:11px;font-weight:700;color:#7A7091;margin-left:2px}
.prow .w{display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden;min-width:0}
.prow .nm{font-size:15px;font-weight:700;letter-spacing:.02em}
.prow .g,.prow .pl{font-size:10px;font-weight:600;color:#7A7091;letter-spacing:0}
.pnone{font-size:13px;color:#7A7091;margin:8px 0 0}
.pfoot{margin-top:22px;text-align:right;font-family:"Fredoka",var(--num);font-weight:600;font-size:12px;letter-spacing:.24em;color:#B7A98F}
.rklink{display:block;width:100%;margin-top:12px;border:2px solid #0B45B0;background:#0B45B0;color:#fff;border-radius:16px;padding:12px;font:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #072C73}
@media print{body{background:#fff}.noprint{display:none!important}.card{box-shadow:none}}
</style>
<div class="wrap">
  <header><span class="logo"><i style="background:var(--c-run)"></i><i style="background:var(--c-side)"></i><i style="background:var(--c-jump)"></i><i style="background:var(--c-ball)"></i></span>
    <div><h1>体力測定の結果</h1><small>Arrows体操教室</small></div></header>

  <form class="card login" id="login" autocomplete="off">
    <h2>お子さまの結果を見る</h2>
    <p>お子さまのお名前と生年月日を入れてください。教室にご登録の内容と合ったときだけ、その子の結果が出ます。</p>
    <label for="nm">お名前（漢字・フルネーム）</label>
    <input id="nm" placeholder="例：山田　太郎" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>生年月日<small>西暦で</small></label>
    <div class="bd"><input id="by" class="num" inputmode="numeric" maxlength="4" placeholder="2018"><input id="bm" class="num" inputmode="numeric" maxlength="2" placeholder="月"><input id="bdd" class="num" inputmode="numeric" maxlength="2" placeholder="日"></div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="go" type="submit">結果を見る</button>
    <button class="rklink" id="rkOpen1" type="button">🏆 全教室のランキングを見る</button>
    <p class="note">ご兄弟の結果は、1人ずつお名前と生年月日を入れて見てください。見終わったら「とじる」を押してください。</p>
  </form>

  <section id="res" class="res" hidden></section>
  <section id="rkv" class="rkv" hidden></section>

  <p class="foot">Arrows体操教室　TEL 086-523-5582（平日10:00〜18:00）<br>このページの記録は、お子さまの成長のために使います。ほかの方に教えないでください。</p>
</div>
<script>
(function(){
const EXEC = window.KEKKA_EXEC || "%%EXEC%%";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v, d) => Number(v).toFixed(d);
const han = s => String(s || "").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\D/g, "");

function call(fn, args){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  return fetch(EXEC, {method:"POST", body: JSON.stringify({fn, args}), signal: ctl.signal})
    .then(r => r.json()).then(o => { clearTimeout(t); if(!o.ok) throw new Error(o.error); return o.data; })
    .catch(e => { clearTimeout(t); throw e; });
}

$("login").onsubmit = async e => {
  e.preventDefault();
  const name = $("nm").value.trim(), y = han($("by").value), m = han($("bm").value), d = han($("bdd").value);
  $("err").textContent = "";
  if(!name){ $("err").textContent = "お名前を入れてください。"; return; }
  if(y.length !== 4 || !m || !d || +m < 1 || +m > 12 || +d < 1 || +d > 31){ $("err").textContent = "生年月日を西暦で入れてください（例：2018年4月5日）。"; return; }
  const b = y + "-" + m.padStart(2, "0") + "-" + d.padStart(2, "0");
  $("go").disabled = true; $("go").textContent = "さがしています…";
  try { const r = await call("login", [name, b]); r.birth = [+y, +m, +d]; show(r); }
  catch(err){ $("err").textContent = /Failed|abort|network|fetch|JSON/i.test(String(err)) ? "つながりませんでした。電波のよい所でもう一度お試しください。" : String(err.message || err); }
  $("go").disabled = false; $("go").textContent = "結果を見る";
};

function chart(it){
  const pts = it.hist.map(h => ({t: h.t, v: h.v})); if(it.best != null) pts.push({t: "今回", v: it.best, now: true});
  if(pts.length < 2) return "";
  const W = 160, H = 74, L = 22, R = 22, T = 18, B = 16;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if(hi === lo){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * .2; lo -= pad; hi += pad;
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => { const f = (v - lo) / (hi - lo); return T + (it.low ? f : 1 - f) * (H - T - B); };
  const c = `var(--c-${it.k})`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(it.label)}の記録の移り変わり">
    <line x1="${L}" y1="${H-B+4}" x2="${W-R}" y2="${H-B+4}" stroke="var(--line)" stroke-width="2"/>
    <polyline points="${pts.map((p,i) => x(i)+","+y(p.v)).join(" ")}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${p.now?5:4}" fill="${p.now?c:"#fff"}" stroke="${c}" stroke-width="2.5"/>
      <text x="${x(i)}" y="${y(p.v)-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="var(--num)">${fmt(p.v, it.d)}</text>
      <text x="${x(i)}" y="${H-3}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(p.t.replace(/^20\d\d年/, ""))}</text>`).join("")}
  </svg>`;
}

// ---- ランキング（だれでも見られる。部ごとに4種目の5位まで） ----
// 部ごとの色（ポスターと同じ）：見出し・1〜3位の色、RANKING の文字色
const RK_COLOR = { "男子5年生・6年生の部": ["#E5262A", "#ECF25B"], "女子5年生・6年生の部": ["#E5262A", "#F59BFF"],
  "男子3年生・4年生の部": ["#3FA9F5", "#ECF25B"], "女子3年生・4年生の部": ["#3FA9F5", "#F59BFF"],
  "男子1年生・2年生の部": ["#1E8A3C", "#ECF25B"], "女子1年生・2年生の部": ["#1E8A3C", "#F59BFF"],
  "年中・年長の部": ["#F08BDD", "#ECF25B"], "1歳児・2歳児・年少の部": ["#7B4FE0", "#F59BFF"] };
let RK = null, RKI = 0, RK_FROM = "login";
const zen = n => String(n).replace(/[0-9]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0));
async function openRank(){
  RK_FROM = $("res").hidden ? "login" : "res";
  $("login").hidden = true; $("res").hidden = true; $("rkv").hidden = false; document.body.classList.add("rk"); scrollTo(0, 0);
  if(!RK){
    $("rkv").innerHTML = `<div class="msg">読み込んでいます…</div>`;
    try { RK = await call("ranking", []); RK.bu = RK.bu.filter(b => !/中学生/.test(b.title)); }   // 中学生のランキングは出さない（11/20 本人）
    catch(e){ $("rkv").innerHTML = `<div class="msg">${esc(/Failed|abort|network|fetch|JSON/i.test(String(e)) ? "つながりませんでした。電波のよい所でもう一度お試しください。" : String(e.message || e))}</div><div style="text-align:center"><button class="back" id="rkBack">← もどる</button></div>`; $("rkBack").onclick = closeRank; return; }
  }
  drawRank();
}
function closeRank(){
  $("rkv").hidden = true; document.body.classList.remove("rk");
  if(RK_FROM === "res") $("res").hidden = false; else $("login").hidden = false;
  scrollTo(0, 0);
}
function drawRank(){
  const bu = RK.bu[RKI]; if(!bu){ $("rkv").innerHTML = `<div class="msg">まだランキングはありません</div>`; return; }
  const IT = Object.fromEntries(bu.items.map(it => [it.k, it]));
  const EN = {side: "SIDE STEP", run: "25M DASH", jump: "STANDING JUMP", ball: "BALL THROW"};
  const HC = {side: "#F2468A", run: "#FF7A2F", jump: "#22A867", ball: "#2D86F0"};
  const blk = it => `<div class="pblk"><h4 style="background:${HC[it.k]}">${esc(it.label === "ボール投げ" ? "テニスボール投げ" : it.label)}</h4>` + (it.list.length
    ? it.list.map(e => `<div class="prow r${e.rank}"><span class="n">${e.rank}</span><span class="v">${Number(e.v).toFixed(it.d)}<small>${esc(it.unit)}</small></span><span class="w"><span class="nm">${esc(e.name)}</span><span class="g">${esc(e.grade)}</span><span class="pl">${esc(e.place.replace(/^瀬戸内/, ""))}</span></span></div>`).join("")
    : `<p class="pnone">まだ記録がありません</p>`) + `</div>`;
  $("rkv").innerHTML = `<div class="chips">${RK.bu.map((b, i) => `<button data-i="${i}" aria-pressed="${i === RKI}">${esc(b.title.replace(/の部$/, ""))}</button>`).join("")}</div>
    <div class="pw"><div class="poster">
      <div class="ptop"><div><div class="k">${esc(RK.date || "")} 体力測定</div><div class="t">RANKING<i>★</i></div></div>
        <div class="bu"><b${bu.title.length > 11 ? ' style="font-size:18px;padding:5px 12px"' : ""}>${esc(bu.title)}</b><span>測定者 <em>${bu.n}</em> 名</span></div></div>
      <div class="pgrid">${blk(IT.side)}${blk(IT.run)}${blk(IT.jump)}${blk(IT.ball)}</div>
    </div></div>
    <div style="text-align:center"><button class="back" id="rkBack">← もどる</button></div>`;
  fitPoster(); if(document.fonts) document.fonts.ready.then(fitPoster);
  $("rkv").querySelectorAll(".chips button").forEach(b => b.onclick = () => { RKI = +b.dataset.i; drawRank(); });
  $("rkBack").onclick = closeRank;
}
// ポスターを画面の幅（と高さ）に合わせて縮める
function fitPoster(){
  const w = $("rkv").querySelector(".pw"), p = w && w.querySelector(".poster"); if(!p) return;
  const top = $("rkv").querySelector(".chips").offsetHeight + 8;
  const s = Math.min(w.clientWidth / 707, Math.max(.3, (innerHeight - top - 4) / p.offsetHeight));
  p.style.transform = `scale(${s})`; p.style.left = Math.max(0, (w.clientWidth - 707 * s) / 2) + "px";
  w.style.height = (p.offsetHeight * s) + "px";
}
addEventListener("resize", () => { if(!$("rkv").hidden) fitPoster(); });
$("rkOpen1").onclick = () => openRank();
// 教室名から担当の名前（・藤木クラス など）を外す：「井原体育館（木18:00・藤木クラス）」→「井原体育館（木18:00）」
const roomName = r => String(r || "").replace(/・[^（）]*）$/, "）");
// きょうの満年齢
function ageOf([y, m, d]){ const t = new Date(); let a = t.getFullYear() - y; if(t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) a--; return a; }
function show(d){
  $("login").hidden = true;
  const items = d.items.map(it => {
    const head = `<div class="hd" style="background:var(--t-${it.k})"><span style="width:12px;height:12px;border-radius:50%;background:var(--c-${it.k})"></span>${esc(it.label)}</div>`;
    const pv = it.prev ? `<div class="cmpline">前回 <span class="num">${fmt(it.prev.v, it.d)}</span>${esc(it.unit)}` : "";
    if(it.best == null) return `<div class="card item">${head}<div class="bdy"><span class="none">今回の記録なし</span>${pv ? pv + "</div>" : ""}</div></div>`;
    const rk = it.rank && !/中学生/.test(it.rank.bu || "") && it.rank.bu ? `<span class="rank r${it.rank.n}"><b>${it.rank.n}</b>位<small>${esc(it.rank.bu)}</small></span>` : "";
    let cmp = "";
    if(it.prev){
      const diff = +(it.best - it.prev.v).toFixed(it.d), g = it.low ? -diff : diff;
      cmp = pv + (g > 0 ? `<span class="up">▲${fmt(Math.abs(diff), it.d)}</span>` : "") + `</div>`;
    }
    return `<div class="card item">${head}<div class="bdy"><div class="big"><span class="v">${fmt(it.best, it.d)}</span><span class="u">${esc(it.unit)}</span></div>${rk}${cmp}${chart(it)}</div></div>`;
  }).join("");
  const anyRank = d.items.some(it => it.rank);
  $("res").innerHTML = `<div class="card who"><span class="tag">${esc(d.date)}の体力測定</span><h2>${esc(d.name)} さん</h2><div class="sub">${esc(d.grade)}${d.sex ? "・" + esc(d.sex) : ""}　${esc(roomName(d.room))}</div>${d.birth ? `<div class="sub">生年月日 ${d.birth[0]}年${d.birth[1]}月${d.birth[2]}日（${ageOf(d.birth)}歳）</div>` : ""}</div>
    ${d.comment ? `<div class="card comment"><h3>先生から一言</h3><p>${esc(d.comment)}</p></div>` : ""}
    <div class="items">${items}</div>
    <p class="note">記録は、2回測ったうちの良いほうです。${anyRank ? "順位は、全教室のランキング（同じ部の中）の順位です（5位まで表示）。" : ""}</p>
    <button class="rklink noprint" id="rkOpen2" type="button">🏆 全教室のランキングを見る</button>
    <button class="btn ghost noprint" id="bye" type="button">とじる（ほかの子を見る）</button>`;
  $("rkOpen2").onclick = () => openRank();
  $("res").hidden = false;
  $("bye").onclick = () => { $("res").innerHTML = ""; $("res").hidden = true; $("login").hidden = false; $("login").reset(); $("err").textContent = ""; scrollTo(0, 0); };
  scrollTo(0, 0);
}
})();
</script>
