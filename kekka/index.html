<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Arrows 体力測定 結果</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#FFF7EA;color:#2B2152;font:17px/1.6 -apple-system,"Hiragino Sans",sans-serif;text-align:center}</style>
</head><body><p id="msg">読み込んでいます…</p>
<script>
// Arrows 体力測定 結果ページ（保護者用）の入口。画面の本体は保護者用の Apps Script から受け取る
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbzoK4Jbred79QuAP6K1me4sXA_QbKrxjJk-ftCF32-ufbrVop9THCXbLw_95HYONVhrQA/exec";
  window.KEKKA_EXEC = EXEC;
  fetch(EXEC + "?action=page&t=" + Date.now())
    .then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (h) {
      if (h.indexOf("体力測定") < 0) throw 0;
      document.open(); document.write(h); document.close();
    })
    .catch(function () { document.getElementById("msg").textContent = "つながりませんでした。電波のよい所で、もう一度開いてください。"; });
})();
</script>
</body></html>
